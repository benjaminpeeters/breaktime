# Breaktime Configuration File
# Automated break scheduling system
# 
# Edit this file to customize your break schedules
# Time format: "HH:MM" (24-hour format)
# Set to null to disable for specific days

# Global settings
enabled: true
default_action: suspend  # suspend, shutdown, hibernate
debug: false             # true = detailed logs in ~/.local/state/breaktime/logs

# Which days you work, and how "weekdays"/"weekends" times are applied
schedule:
  workdays: [mon, tue, wed, thu, fri]  # e.g. [mon, tue, wed, thu] for a 4-day week
  mode: evening            # evening (default) or calendar
  day_starts_at: "04:00"   # times before this belong to the previous evening
  evening_starts_at: "18:00"

# Break schedules and notifications
alarms:
  bedtime:
    enabled: true
    action: suspend
    weekdays: "23:00"     # nights before a workday (Sun-Thu by default)
    weekends: "00:30"     # nights before a day off (Fri-Sat night by default)
    warnings:
      - minutes: 10
        message: "🌙 Time to start winding down! Bedtime in 10 minutes"
      - minutes: 2
        message: "😴 Save your work! Going to sleep in 2 minutes"
  
  lunch_break:
    enabled: false
    action: suspend
    weekdays: "12:30"     # Midday break on workdays
    weekends: null        # No lunch break on weekends
    warnings:
      - minutes: 5
        message: "🍽️ Lunch break is over! Suspending in 5 minutes"
      - minutes: 1
        message: "⏰ Back to work mode - suspending in 1 minute"
  
  afternoon_nap:
    enabled: false
    action: suspend
    weekdays: null        # No nap on workdays
    weekends: "15:00"     # Weekend afternoon nap
    warnings:
      - minutes: 5
        message: "💤 Nap time! System suspending in 5 minutes"
  
  focus_break:
    enabled: false
    action: suspend
    weekdays: "16:00"     # End of deep work session
    weekends: null        # No focus breaks on weekends
    warnings:
      - minutes: 3
        message: "🧠 Deep work session ending - take a break in 3 minutes"
      - minutes: 1
        message: "🔄 Time to step away from the screen!"

# Exception dates (override normal schedule) - NOT YET IMPLEMENTED, ignored
exceptions:
  # Example: New Year's Day later bedtime
  # - date: "2025-01-01"
  #   alarms: ["bedtime"]
  #   time: "01:00"
  #   action: suspend

# Global notification settings
notifications:
  desktop_notifications: true

# Snooze settings for the final dialog
snooze:
  max_snoozes: 3        # Maximum number of snoozes allowed per alarm
  snooze_duration: 2    # Minutes to delay each snooze

# ============================================================================
# Configuration Guide:
# ============================================================================
# 
# ALARM STRUCTURE:
# Each alarm can have:
# - enabled: true/false
# - action: suspend/shutdown/hibernate
# - weekdays: "HH:MM" or null
# - weekends: "HH:MM" or null
# - warnings: list of minute/message pairs
# 
# TIME FORMAT:
# Use 24-hour format: "23:00" for 11 PM, "07:30" for 7:30 AM
# 
# ACTIONS:
# - suspend: Put computer to sleep (recommended)
# - shutdown: Complete shutdown
# - hibernate: Save to disk and power off
# 
# WARNINGS:
# Configure multiple warnings before each break
# - minutes: how many minutes before the break
# - message: custom notification text with emojis
# 
# WEEKDAYS vs WEEKENDS (see the "schedule" section):
# - "weekdays" times apply on work days, "weekends" times on days off.
#   Work days are listed in schedule.workdays (default Monday-Friday).
# - mode: evening (default)
#   * Daytime alarms (between day_starts_at and evening_starts_at, e.g. lunch)
#     use the weekdays time when TODAY is a workday.
#   * Night alarms (after evening_starts_at or before day_starts_at, e.g.
#     bedtime) use the weekdays time when TOMORROW is a workday. So with the
#     default workdays, bedtime uses "weekdays" on Sunday-Thursday nights and
#     "weekends" on Friday and Saturday nights. A time like "00:30" is part
#     of the evening before (Friday night -> Saturday 00:30).
#   * Whether an alarm is a night alarm is decided by its weekdays time
#     (or its weekends time if weekdays is null).
# - mode: calendar
#   * The weekdays time applies on the calendar days listed in workdays,
#     whatever the hour ("00:30" on Saturday means Saturday 00:30).
# - Use null to disable for specific day types
# 
# SNOOZE FEATURE:
# - Applies to the final dialog shown at the alarm time
# - Each snooze delays the action by the configured duration
# - After max snoozes, only "OK" and "Sleep Now" buttons appear
# - Snooze settings apply globally to all alarms
# 
# CUSTOMIZATION TIPS:
# 1. Start with bedtime only, then add other breaks
# 2. Use different times for weekdays vs weekends
# 3. Customize messages to match your workflow
# 4. Test with short intervals first
# 5. Adjust max_snoozes based on your workflow needs
# 
# COMMANDS:
# - breaktime --config    Edit this file
# - breaktime --status    View current schedule
# - breaktime --install   Set up automatic scheduling
# - breaktime --test-notifications   Check that dialogs can be shown
# ============================================================================